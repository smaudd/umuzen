{% if messages %}
<ul class="messages">
    {% for message in messages %}
        <li{% if message.tags %} class="{{ message.tags }}"{% endif %}>{{ message }}</li>
    {% endfor %}
</ul>
{% endif %}
<h2>Search Videos</h2>
<form method="get" action="{% url 'search_videos' %}" hx-boost="true" hx-target="#main-content" hx-swap="innerHTML" hx-push-url="true">
    <input type="text" name="q" value="{{ query }}" placeholder="Search by title..." required>
    <button type="submit">Search</button>
</form>
{% include "downloader/_video_table.html" with videos=videos show_playlist_add=True show_delete=False %}
